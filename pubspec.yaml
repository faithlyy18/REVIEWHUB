name: exam_reviewer
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter



  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  archive: ^3.4.9
  xml: ^6.5.0
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.3+4
  url_launcher: ^6.2.0
  cloud_functions: ^6.0.7

  # File & path utilities (for document upload)
  file_picker: ^8.1.7
  path: ^1.9.0

  # Google Drive integration for instructor module uploads — lets an
  # instructor connect their Google account once and pick a PDF/DOCX
  # straight from their Drive instead of pasting a shareable link.
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Printing / PDF export for the Reports page (Daily Review Report).
  pdf: ^3.12.0
  printing: ^5.14.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

  # Generates native app icons (Android + iOS + Web) from a single source image.
  flutter_launcher_icons: ^0.14.3

# Config for flutter_launcher_icons. Run:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # Android 8+ adaptive icon (keeps the logo crisp on round/square/squircle masks)
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D1B4C"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
  # Web favicon + PWA icons (used when you run `flutter build web` / `firebase deploy`)
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0D1B4C"
    theme_color: "#0D1B4C"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets. The BISU seal used by the Reports header is
  # assets/images/bisu_logo.png — this file MUST exist before you build.
  assets:
    - assets/icon/icon.png
    - assets/images/bisu_logo.png